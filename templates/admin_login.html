{% extends "base.html" %}

{% block title %}Acesso Administrativo - INTS{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-7 bg-[#343746] p-8 sm:p-10 rounded-3xl shadow-2xl border border-[#6272a4]/40">
    
    <!-- Header with Custom Halloween Lock Icon -->
    <div class="text-center">
      <img src="{{ url_for('static', filename='img/icon_admin.jpg') }}" alt="Moderação" 
           class="h-20 w-20 rounded-2xl mx-auto mb-4 object-cover shadow-xl ring-2 ring-[#8be9fd]/50 animate-float">
      <h2 class="text-2xl sm:text-3xl font-black text-[#f8f8f2] tracking-tight">Painel de Moderação</h2>
      <p class="text-xs sm:text-sm text-[#6272a4] mt-1.5">Acesso restrito à comissão organizadora do INTS</p>
    </div>

    <!-- Login Form -->
    <form class="mt-6 space-y-6" method="POST" action="{{ url_for('admin.login') }}" autocomplete="off">
      <input type="hidden" name="next" value="{{ next_url }}">
      
      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-[#ffb86c] mb-2">
          Senha Administrativa
        </label>
        <div class="relative">
          <input id="password" name="password" type="password" required autofocus
                 class="w-full px-4 py-3.5 bg-[#282a36] border border-[#6272a4]/50 rounded-xl text-[#f8f8f2] placeholder-[#6272a4] focus:ring-2 focus:ring-[#bd93f9]/40 focus:border-[#bd93f9] outline-none transition pr-12 text-sm"
                 placeholder="Digite a senha de administrador">
          <button type="button" id="toggle-password" 
                  class="absolute inset-y-0 right-0 pr-4 flex items-center text-[#6272a4] hover:text-[#bd93f9] focus:outline-none"
                  title="Exibir / ocultar senha">
            <svg id="eye-icon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div>
        <button type="submit" 
                class="w-full flex justify-center items-center space-x-2 py-3.5 px-4 rounded-xl shadow-xl text-base font-black text-[#282a36] bg-gradient-to-r from-[#bd93f9] to-[#8be9fd] hover:from-[#caa6fa] hover:to-[#a4f0ff] focus:outline-none transition transform hover:scale-[1.01] active:scale-[0.99] cursor-pointer">
          <img src="{{ url_for('static', filename='img/icon_admin.jpg') }}" alt="Entrar" class="w-5 h-5 rounded-md object-cover">
          <span>Entrar no Painel</span>
        </button>
      </div>
    </form>

    <div class="text-center pt-2">
      <a href="{{ url_for('public.register') }}" class="text-xs font-semibold text-[#6272a4] hover:text-[#bd93f9] transition flex items-center justify-center gap-1.5">
        <span>&larr;</span> Voltar para a Inscrição
      </a>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', function() {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
        } else {
          pwdInput.type = 'password';
        }
      });
    }
  });
</script>
{% endblock %}
