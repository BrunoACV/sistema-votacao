# ---------------------------------------------------------------------------
# Sistema de Votação Institucional de Halloween INTS em contêiner.
#
#   Subir (e reconstruir a imagem):  docker compose up -d --build
#   Ver o log:                       docker compose logs -f votacao
#   Parar:                           docker compose down
#   Reiniciar:                       docker compose restart votacao
#
# A porta de fora é HALLOWEEN_PORTA (padrão 9090); dentro do contêiner é sempre
# 9090. Para outra porta:  HALLOWEEN_PORTA=9091 docker compose up -d
# ---------------------------------------------------------------------------
services:
  votacao:
    build: .
    image: sistema-votacao-ints:latest
    container_name: sistema-votacao-ints
    restart: unless-stopped

    # O .env do repositório entra como variável de ambiente, e não como arquivo
    # dentro da imagem. ATENÇÃO: o Compose interpreta "$" nos valores deste
    # arquivo; se houver senha com "$", escreva como "$$".
    env_file:
      - .env

    environment:
      # Fixos aqui, vencendo o .env para garantir alinhamento interno do contêiner
      PORT: "9090"
      HOST: "0.0.0.0"
      APP_ENV: production
      TZ: America/Bahia

    ports:
      - "${HALLOWEEN_PORTA:-9090}:9090"

    volumes:
      # Banco de dados SQLite persistente (participantes, fotos, votos, histórico).
      # Pasta do host, e não volume anônimo: sobrevive a rebuilds e atualizações.
      - ./data:/app/data

      # Diretório de fotos das fantasias enviadas pelos candidatos.
      - ./static/uploads:/app/static/uploads

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
