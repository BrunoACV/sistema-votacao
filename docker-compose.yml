# ---------------------------------------------------------------------------
# Sistema de Votação Institucional INTS em contêiner Docker.
#
#   Subir (e reconstruir a imagem):  docker compose up -d --build
#   Ver o log:                       docker compose logs -f votacao
#   Parar:                           docker compose down
#   Reiniciar:                       docker compose restart votacao
#
# A porta no host é VOTACAO_PORTA (padrão 9090); dentro do contêiner é sempre 9090.
# Para outra porta no servidor:  VOTACAO_PORTA=8080 docker compose up -d
# ---------------------------------------------------------------------------
services:
  votacao:
    build: .
    image: sistema-votacao:latest
    container_name: sistema-votacao
    restart: unless-stopped

    # O .env do repositório entra como variável de ambiente, e não como arquivo
    # dentro da imagem. ATENÇÃO: o Compose interpreta "$" nos valores deste
    # arquivo; se houver senha com "$", escreva como "$$".
    env_file:
      - .env

    environment:
      # Fixos aqui, vencendo o .env para garantir alinhamento interno do contêiner
      PORT: "9090"
      HOST: "0.0.0.0"
      APP_ENV: production
      TZ: America/Bahia

    ports:
      - "${VOTACAO_PORTA:-${HALLOWEEN_PORTA:-9090}}:9090"

    volumes:
      # DADOS DE PRODUÇÃO em volumes nomeados do Docker, FORA da pasta do Git:
      # git pull / clone novo / rebuild nunca tocam neles. Só "docker compose down -v"
      # (com -v) apaga — não use -v em produção.
      - votacao_dados:/app/data          # banco SQLite + backups automáticos
      - votacao_fotos:/app/static/uploads # fotos dos candidatos

      # Banco e fotos iniciais que vêm no repositório (ou de instalação antiga com
      # dados em ./data): lidos SÓ quando o volume está vazio, e sempre em modo leitura.
      - ./data:/app/legado:ro
      - ./static/uploads:/app/legado-fotos:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  votacao_dados:
    name: sistema-votacao-dados
  votacao_fotos:
    name: sistema-votacao-fotos
