# ---------------------------------------------------------------------------
# Sistema de Votação Institucional INTS em contêiner Docker.
#
#   Subir (e reconstruir a imagem):  docker compose up -d --build
#   Ver o log:                       docker compose logs -f votacao
#   Parar:                           docker compose down
#   Reiniciar:                       docker compose restart votacao
#
# A porta no host é VOTACAO_PORTA (padrão 9090); dentro do contêiner é sempre 9090.
# Para outra porta no servidor:  VOTACAO_PORTA=8080 docker compose up -d
# ---------------------------------------------------------------------------
services:
  votacao:
    build: .
    image: sistema-votacao:latest
    container_name: sistema-votacao
    restart: unless-stopped

    # O .env do repositório entra como variável de ambiente, e não como arquivo
    # dentro da imagem. ATENÇÃO: o Compose interpreta "$" nos valores deste
    # arquivo; se houver senha com "$", escreva como "$$".
    env_file:
      - .env

    environment:
      # Fixos aqui, vencendo o .env para garantir alinhamento interno do contêiner
      PORT: "9090"
      HOST: "0.0.0.0"
      APP_ENV: production
      TZ: America/Bahia

    ports:
      - "${VOTACAO_PORTA:-${HALLOWEEN_PORTA:-9090}}:9090"

    volumes:
      # Banco de dados SQLite persistente (participantes, fotos, votos, histórico).
      # Mapeado diretamente no diretório ./data do host: já contém a cópia atualizada
      # do banco e persiste todos os novos votos e eventos.
      - ./data:/app/data

      # Diretório de fotos dos participantes enviadas no cadastro.
      - ./static/uploads:/app/static/uploads

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
